<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Font System Pro Max Debug</title>

<style>
:root{
  --bg:#0f1220;
  --card:#171a2b;
  --text:#e7e9ff;
  --muted:#9aa0c3;
  --border:#2a2f4a;
}

body{
  margin:0;
  background:var(--bg);
  color:var(--text);
  font-family:Arial;
}

/* ===== 主体 ===== */
.container{
  max-width:1400px;
  margin:0 auto;
  padding:20px;
}

.layout{
  display:grid;
  grid-template-columns:240px 1fr;
  gap:16px;
}

/* ===== sidebar ===== */
.sidebar{
  background:var(--card);
  border:1px solid var(--border);
  padding:12px;
  border-radius:14px;
  height:fit-content;
  position:sticky;
  top:10px;
}

button{
  background:#0c0f1d;
  color:var(--text);
  border:1px solid var(--border);
  padding:6px 10px;
  border-radius:8px;
  cursor:pointer;
  margin:4px 4px 4px 0;
}

.folder-item{
  display:flex;
  gap:6px;
  margin:6px 0;
  font-size:13px;
}

/* ===== main ===== */
.toolbar{
  display:flex;
  gap:10px;
  margin-bottom:10px;
}

input{
  background:#0c0f1d;
  border:1px solid var(--border);
  color:var(--text);
  padding:8px;
  border-radius:10px;
}

.grid{
  display:grid;
  grid-template-columns:repeat(auto-fill,minmax(260px,1fr));
  gap:12px;
}

.card{
  background:var(--card);
  border:1px solid var(--border);
  padding:12px;
  border-radius:14px;
}

.preview{
  font-size:26px;
  margin-top:10px;
}

.title{font-size:14px;font-weight:600;}
.file{font-size:12px;color:var(--muted);}

/* ===== DEBUG PANEL ===== */
#debugPanel{
  position:fixed;
  right:0;
  top:0;
  width:340px;
  height:100vh;
  background:#0b0e1a;
  border-left:1px solid #2a2f4a;
  overflow:auto;
  padding:10px;
  z-index:9999;
}

.debug-item{
  border:1px solid #2a2f4a;
  border-radius:8px;
  padding:8px;
  margin:6px 0;
  cursor:pointer;
}

.small{font-size:12px;color:#9aa0c3;}
</style>
</head>

<body>

<!-- ================= DEBUG PANEL ================= -->
<div id="debugPanel">
  <h3>Font Debug Panel</h3>
  <button onclick="runDebug()">Scan Fonts</button>
  <button onclick="clearDebug()">Clear</button>
  <div id="debugList"></div>
</div>

<!-- ================= MAIN ================= -->
<div class="container">
<div class="layout">

<!-- sidebar -->
<aside class="sidebar">
<h4>Folders</h4>

<button onclick="selectAll()">All</button>
<button onclick="selectNone()">None</button>

<div id="folderList"></div>
</aside>

<!-- main -->
<main>

<div class="toolbar">
  <input id="textInput" value="输入预览文字" style="flex:1"/>
  <input id="searchInput" placeholder="搜索字体..." />
</div>

<div id="grid" class="grid"></div>

</main>

</div>
</div>

const getCn=f=>cnMap[f.family]||f.family;

/* =========================
   CDN + FONT LOADER
========================= */

const CDN="https://cdn.jsdelivr.net/gh/willychenkit-ui/font-preview@main/";
const loaded=new Set();

function url(file){
  const p=file.split("/");
  const n=encodeURIComponent(p.pop());
  return CDN + [...p,n].join("/");
}

async function loadFont(f){
  if(loaded.has(f.family)) return;

  try{
    const font=new FontFace(f.family,`url(${url(f.file)})`);
    await font.load();
    document.fonts.add(font);
    loaded.add(f.family);
  }catch(e){}
}

/* =========================
   FOLDERS
========================= */

const folders=[...new Set(fonts.map(f=>f.file.split("/")[0]))];

// 默认只选 FZ-12
const selected=new Set(["FZ-12"]);

const folderList=document.getElementById("folderList");

function selectAll(){
  selected.clear();
  folders.forEach(f=>selected.add(f));
  syncUI();
  apply();
}

function selectNone(){
  selected.clear();
  syncUI();
  apply();
}

function syncUI(){
  document.querySelectorAll(".cb").forEach(cb=>{
    cb.checked=selected.has(cb.dataset.f);
  });
}

folders.forEach(f=>{
  const label=document.createElement("label");
  label.className="folder-item";

  const cb=document.createElement("input");
  cb.type="checkbox";
  cb.className="cb";
  cb.dataset.f=f;
  cb.checked=selected.has(f);

  cb.onchange=()=>{
    if(cb.checked) selected.add(f);
    else selected.delete(f);
    apply();
  };

  label.appendChild(cb);
  label.appendChild(document.createTextNode(f));
  folderList.appendChild(label);
});

/* =========================
   FILTER + RENDER
========================= */

function filter(){
  const q=document.getElementById("searchInput").value.toLowerCase();

  return fonts.filter(f=>{
    const folder=f.file.split("/")[0];
    return selected.has(folder) &&
      (f.family+getCn(f)).toLowerCase().includes(q);
  });
}

function render(list){
  const grid=document.getElementById("grid");
  grid.innerHTML="";

  const text=document.getElementById("textInput").value;

  const frag=document.createDocumentFragment();

  list.forEach(f=>{
    const card=document.createElement("div");
    card.className="card";

    const title=document.createElement("div");
    title.className="title";
    title.textContent=getCn(f);

    const file=document.createElement("div");
    file.className="file";
    file.textContent=f.file;

    const preview=document.createElement("div");
    preview.className="preview";
    preview.style.fontFamily=`"${f.family}"`;
    preview.textContent=text;

    card.appendChild(title);
    card.appendChild(file);
    card.appendChild(preview);

    frag.appendChild(card);

    loadFont(f);
  });

  grid.appendChild(frag);
}

function apply(){
  render(filter());
}

/* =========================
   FONT DEBUG ENGINE
========================= */

const FontDebug={

  measure(text,font){
    const c=document.createElement("canvas");
    const ctx=c.getContext("2d");
    ctx.font=`40px ${font}`;
    return ctx.measureText(text).width;
  },

  isFallback(font){
    const base=this.measure("中文ABC123","sans-serif");
    const test=this.measure("中文ABC123",`"${font}",sans-serif`);
    return Math.abs(base-test)<0.5;
  },

  inspect(name){
    const inDoc=[...document.fonts].some(f=>f.family===name);

    const result={
      font:name,
      inDocumentFonts:inDoc,
      fallback:this.isFallback(name),
      loaded:document.fonts.check(`40px "${name}"`)
    };

    result.status=
      !inDoc?"❌ NOT LOADED":
      result.fallback?"🟡 FALLBACK":
      "🟢 OK";

    return result;
  }
};

/* =========================
   DEBUG UI
========================= */

function runDebug(){
  const box=document.getElementById("debugList");
  box.innerHTML="";

  fonts.forEach(f=>{
    const r=FontDebug.inspect(f.family);

    const div=document.createElement("div");
    div.className="debug-item";

    div.innerHTML=`
      <b>${f.family}</b><br/>
      <span class="small">${getCn(f)}</span><br/>
      <span>${r.status}</span>
    `;

    div.onclick=()=>alert(JSON.stringify(r,null,2));

    box.appendChild(div);
  });
}

function clearDebug(){
  document.getElementById("debugList").innerHTML="";
}

/* =========================
   EVENTS
========================= */

document.getElementById("searchInput").oninput=apply;

document.getElementById("textInput").oninput=()=>{
  document.querySelectorAll(".preview").forEach(el=>{
    el.textContent=document.getElementById("textInput").value;
  });
};

/* =========================
   INIT
========================= */

apply();
