<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>无限极字体预览库</title>
  <style>
    :root { --bg:#0f1220; --card:#171a2b; --text:#e7e9ff; --muted:#9aa0c3; --border:#2a2f4a; }
    * { box-sizing: border-box; }
    body { margin:0; background: radial-gradient(1200px 800px at 20% -10%, #1b2040, #0f1220); color:var(--text); font-family: -apple-system, BlinkMacSystemFont, Segoe UI, Roboto, Arial; }
    .container { max-width:1400px; margin:0 auto; padding:20px; }
    h1 { margin:0 0 12px; font-size:24px; }
    .toolbar { display:flex; gap:12px; flex-wrap:wrap; align-items:center; }
    .input, .search { background:#0c0f1d; border:1px solid var(--border); color:var(--text); padding:10px 12px; border-radius:12px; outline:none; }
    .input { flex:1; min-width:240px; font-size:16px; }
    .search { width:220px; }
    .hint { color:var(--muted); font-size:12px; }
    .grid { display:grid; grid-template-columns: repeat(1, 1fr); gap:12px; margin-top:16px; }
    @media (min-width:640px){ .grid{ grid-template-columns: repeat(2, 1fr);} }
    @media (min-width:1024px){ .grid{ grid-template-columns: repeat(3, 1fr);} }
    .card { background: linear-gradient(180deg, #171a2b, #141733); border:1px solid var(--border); border-radius:18px; padding:14px; box-shadow: 0 10px 30px rgba(0,0,0,.25); }
    .meta { display:flex; justify-content:space-between; align-items:center; margin-bottom:8px; }
    .name { color:var(--muted); font-size:12px; display:flex; flex-direction:column; gap:2px; }
    .cn-name { color:var(--text); font-size:14px; }
    .file-name { color:var(--muted); }
    .btn { cursor:pointer; border:1px solid var(--border); background:#0c0f1d; color:var(--text); border-radius:10px; padding:6px 10px; font-size:12px; }
    .btn:hover { background:#11153a; }
    .btn.small { padding:4px 8px; font-size:11px; }
    .preview { font-size:28px; line-height:1.4; word-break: break-word; }
    .empty { color:var(--muted); text-align:center; padding:40px 0; }
    .layout { display:grid; grid-template-columns: 220px 1fr; gap:16px; }
    .sidebar { background: linear-gradient(180deg, #171a2b, #141733); border:1px solid var(--border); border-radius:18px; padding:14px; height: fit-content; position: sticky; top: 16px; }
    .side-title { font-size:13px; color:var(--muted); letter-spacing: .04em; text-transform: uppercase; }
    .side-actions { display:flex; gap:8px; margin:10px 0 6px; }
    .folder-list { display:flex; flex-direction:column; gap:8px; }
    .folder-item { display:flex; align-items:center; gap:8px; font-size:13px; color:var(--text); }
    .folder-item input { accent-color: #6c7bff; }
    @media (max-width:900px){
      .layout { grid-template-columns: 1fr; }
      .sidebar { position: static; }
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="layout">
      <aside class="sidebar">
        <div class="side-title">Folders</div>
        <div class="side-actions">
          <button id="foldersAll" class="btn small" type="button">All</button>
          <button id="foldersNone" class="btn small" type="button">None</button>
        </div>
        <div class="folder-list" id="folderList">
          <label class="folder-item"><input type="checkbox" data-folder="FZ-12"  checked>FZ-12</label>
          <label class="folder-item"><input type="checkbox" data-folder="FZ-123">FZ-123</label>
          <label class="folder-item"><input type="checkbox" data-folder="HY-16">HY-16</label>
          <label class="folder-item"><input type="checkbox" data-folder="HY-20">HY-20</label>
          <label class="folder-item"><input type="checkbox" data-folder="HG">HG</label>
          <label class="folder-item"><input type="checkbox" data-folder="LX">LX</label>
          <label class="folder-item"><input type="checkbox" data-folder="MN">MN</label>
          <label class="folder-item"><input type="checkbox" data-folder="YS">YS</label>
          <label class="folder-item"><input type="checkbox" data-folder="YGY">YGY</label>
          <label class="folder-item"><input type="checkbox" data-folder="BX">BX</label>
        </div>
      </aside>
      <main>
        <h1>无限极字体预览库</h1>
        <div class="toolbar">
          <input id="textInput" class="input" value="输入你想预览的文字" />
          <input id="searchInput" class="search" placeholder="搜索字体中文名/文件名" />
        </div>
        <div class="hint">提示：如字体无法加载显示，请打开vpn</div>

        <div id="grid" class="grid"></div>
        <div id="empty" class="empty" style="display:none;">没有匹配的字体</div>
      </main>
    </div>
  </div>

    function getFileBaseName(file) {
      return file.split('/').pop().replace(/\.[^.]+$/, '').trim();
    }

    function getFontCnName(f) {
      const baseName = getFileBaseName(f.file);
      if (/[\u4e00-\u9fff]/.test(f.family)) return f.family.trim();
      if (/[\u4e00-\u9fff]/.test(baseName)) return baseName;
      return fontCnNameMap[f.family] || fontCnNameMap[baseName] || '';
    }

    fonts.forEach((font) => {
      font.cnName = getFontCnName(font);
      font.searchText = [font.cnName, font.family, font.file].join(' ').toLowerCase();
    });

    // ===== 2) 按需注入 @font-face（勾选才加载） =====
    const styleEl = document.createElement('style');
    document.head.appendChild(styleEl);
    const loadedFamilies = new Set();
    function ensureFontLoaded(f) {
      if (loadedFamilies.has(f.family)) return;
      styleEl.textContent += `
      @font-face {
        font-family: ${f.family};
        src: url("${f.file}");
        font-display: swap;
      }
      `;
      loadedFamilies.add(f.family);
    }

    // ===== 3) 渲染卡片 =====
    const grid = document.getElementById('grid');
    const empty = document.getElementById('empty');
    const textInput = document.getElementById('textInput');
    const searchInput = document.getElementById('searchInput');
    const foldersAllBtn = document.getElementById('foldersAll');
    const foldersNoneBtn = document.getElementById('foldersNone');
    const folderList = document.getElementById('folderList');
    const folderChecks = Array.from(folderList.querySelectorAll('input[data-folder]'));
    const selectedFolders = new Set(folderChecks.filter(c => c.checked).map(c => c.dataset.folder));

    function getFolder(file) {
      const idx = file.indexOf('/');
      return idx === -1 ? '' : file.slice(0, idx);
    }

    function render(list) {
      grid.innerHTML = '';
      if (!list.length) {
        empty.style.display = 'block';
        return;
      }
      empty.style.display = 'none';

      const frag = document.createDocumentFragment();
      list.forEach((f) => {
        const card = document.createElement('div');
        card.className = 'card';

        const meta = document.createElement('div');
        meta.className = 'meta';

        const name = document.createElement('div');
        name.className = 'name';
        const cnName = document.createElement('span');
        cnName.className = 'cn-name';
        cnName.textContent = f.cnName || f.family;

        const fileName = document.createElement('span');
        fileName.className = 'file-name';
        fileName.textContent = f.file;

        name.appendChild(cnName);
        name.appendChild(fileName);

        const btn = document.createElement('button');
        btn.className = 'btn';
        btn.textContent = '复制名称';
        btn.onclick = () => {
          navigator.clipboard.writeText(f.file);
          btn.textContent = '已复制';
          setTimeout(() => btn.textContent = '复制名称', 1200);
        };

        meta.appendChild(name);
        meta.appendChild(btn);

        const preview = document.createElement('div');
        preview.className = 'preview';
        preview.style.fontFamily = f.family;
        preview.textContent = textInput.value;

        card.appendChild(meta);
        card.appendChild(preview);
        frag.appendChild(card);
      });
      grid.appendChild(frag);
    }

    function applyFilters() {
      const q = searchInput.value.toLowerCase();
      const list = fonts.filter(f => {
        const folder = getFolder(f.file);
        const inFolder = selectedFolders.has(folder);
        const inSearch = f.searchText.includes(q);
        return inFolder && inSearch;
      });
      list.forEach(ensureFontLoaded);
      render(list);
      const val = textInput.value;
      document.querySelectorAll('.preview').forEach(el => el.textContent = val);
    }

    // 初始渲染
    applyFilters();

    // ===== 4) 输入联动 =====
    textInput.addEventListener('input', () => {
      const val = textInput.value;
      document.querySelectorAll('.preview').forEach(el => el.textContent = val);
      // 同步到 URL（可分享）
      const url = new URL(location.href);
      url.searchParams.set('text', val);
      history.replaceState(null, '', url);
    });

    // ===== 5) 搜索过滤 =====
    searchInput.addEventListener('input', () => {
      applyFilters();
    });

    folderChecks.forEach(chk => {
      chk.addEventListener('change', () => {
        if (chk.checked) selectedFolders.add(chk.dataset.folder);
        else selectedFolders.delete(chk.dataset.folder);
        applyFilters();
      });
    });

    foldersAllBtn.addEventListener('click', () => {
      folderChecks.forEach(chk => {
        chk.checked = true;
        selectedFolders.add(chk.dataset.folder);
      });
      applyFilters();
    });

    foldersNoneBtn.addEventListener('click', () => {
      folderChecks.forEach(chk => {
        chk.checked = false;
      });
      selectedFolders.clear();
      applyFilters();
    });

    // ===== 6) 读取分享参数 =====
    const params = new URLSearchParams(location.search);
    const sharedText = params.get('text');
    if (sharedText) {
      textInput.value = sharedText;
      document.querySelectorAll('.preview').forEach(el => el.textContent = sharedText);
    }
  </script>
